name: Build Android AAB & APK (Music King)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "앱 버전 이름 (예: 1.0.0)"
        required: false
        default: "1.0.0"
      version_code:
        description: "Google Play 버전 코드 (비워두면 실행 번호 자동 증가)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "**.sql"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21 (Capacitor 8 / API 36)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Capacitor Dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Web Bundle & Icons/Splash Assets
        run: |
          npm run prepare:www
          npm run prepare:assets

      - name: Generate Android Native Project & Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Configure Keystore Signing (if Secrets exist)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/musicking-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=musicking-release.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release keystore configured."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ GitHub Secrets(KEYSTORE_BASE64 등) 미등록 — 테스트용 app-debug.apk만 빌드합니다."
          fi

      - name: Patch Android Config (API 36, Portrait, ForceDark Off, Version)
        env:
          ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          ANDROID_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
        run: node scripts/patch-android.mjs

      - name: Grant Execute Permission on Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Signed AAB & APK (Release)
        if: steps.signing.outputs.signed == 'true'
        working-directory: ./android
        run: ./gradlew bundleRelease assembleRelease

      - name: Build Debug APK (Fallback when Secrets missing)
        if: steps.signing.outputs.signed != 'true'
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Signed AAB (Google Play)
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: musicking-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Signed APK (Phone Test)
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: musicking-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Debug APK (Unsigned Test)
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: musicking-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
